name: Refresh official award records

on:
  schedule:
    - cron: "17 12 13 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh public USAspending records
        run: node refresh-public.mjs
      - name: Validate public data
        run: node validate.mjs
      - name: Commit verified source changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "federal-spend-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/awards.public.json data/awards.public.csv data/vehicles.public.json data/vehicles.public.csv data/profile.public.json
          git commit -m "Refresh official USAspending records"
          git push
